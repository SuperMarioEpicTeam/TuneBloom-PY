name: Build TuneBloom-Py

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tests/test_synthetic.py
      - run: python -m unittest discover -s tests/nwlib -t .

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64, exe: TuneBloom-Py.exe, sep: ';' }
          - { os: ubuntu-latest,  name: linux-x64,   exe: TuneBloom-Py, sep: ':' }
          - { os: macos-latest,   name: macos-arm64, exe: TuneBloom-Py, sep: ':' }
          - { os: macos-13,       name: macos-x64,   exe: TuneBloom-Py, sep: ':' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade pip pyinstaller numpy
      - run: pyinstaller --onefile --windowed --name TuneBloom-Py --add-data "tunebloom/web${{ matrix.sep }}tunebloom/web" run_tunebloom.py
      - uses: actions/upload-artifact@v4
        with:
          name: TuneBloom-Py-${{ matrix.name }}
          path: dist/${{ matrix.exe }}*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - run: cd artifacts && for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done
      - uses: softprops/action-gh-release@v2
        with: { files: artifacts/*.zip }
